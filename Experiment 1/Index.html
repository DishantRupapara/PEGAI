<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Snake</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app-layout">

    <!-- Left Sidebar -->
    <aside class="sidebar">

        <div class="logo-section">
            <h1>CYBER SNAKE</h1>
            <p>Collect • Grow • Survive</p>
        </div>

        <div class="info-panel">

            <div class="info-box">
                <h3>Current Score</h3>
                <span id="scoreValue">0</span>
            </div>

            <div class="info-box">
                <h3>Snake Size</h3>
                <span id="lengthValue">3</span>
            </div>

            <div class="info-box">
                <h3>Best Score</h3>
                <span id="bestScore">0</span>
            </div>

            <div class="info-box">
                <h3>Status</h3>
                <span id="gameState">Running</span>
            </div>

        </div>

        <div class="action-panel">

            <button id="playAgain">
                Restart Game
            </button>

        </div>

    </aside>


    <!-- Right Side -->
    <section class="game-section">

        <div class="canvas-card">

            <canvas
                id="gameBoard"
                width="600"
                height="600">
            </canvas>

        </div>

    </section>

</div>


<!-- Game Over Window -->

<div id="gamePopup" class="popup hidden">

    <div class="popup-card">

        <h2>MISSION FAILED</h2>

        <p>

            Your Score

            <span id="popupScore">
                0
            </span>

        </p>

        <button id="popupRestart">

            PLAY AGAIN

        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
